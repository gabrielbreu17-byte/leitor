<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de Imagens da Obra</title>
    <!-- Versão estável pura para Web - Sem requisições extras de rede -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 15px;
            background-color: #f1f5f9;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h2 { color: #1e3a8a; margin-top: 0; }
        input[type="file"] {
            margin: 15px 0;
            width: 100%;
            cursor: pointer;
        }
        #status {
            font-weight: 600;
            color: #2563eb;
            margin: 10px 0;
        }
        #preview-img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 4px;
            margin-bottom: 15px;
            display: none;
            border: 1px solid #cbd5e1;
        }
        .resultado-group {
            margin-top: 20px;
            display: none;
        }
        .caixa-texto {
            width: 100%;
            height: 160px;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
            background-color: #f8fafc;
            box-sizing: border-box;
            resize: vertical;
            color: #0f172a;
            margin-bottom: 10px;
        }
        .btn-copiar {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-copiar:hover { background: #059669; }
    </style>
</head>
<body>

<div class="card">
    <h2>Leitor de Texto de Imagens</h2>
    <p style="font-size: 13px; color: #64748b;">Carregue a foto da obra para extrair o texto completo dela abaixo.</p>
    
    <input type="file" id="input-foto" accept="image/*">
    
    <center><img id="preview-img" alt="Foto carregada"></center>
    
    <div id="status">Aguardando arquivo...</div>

    <div id="bloco-resultados" class="resultado-group">
        <h3>📝 Texto Identificado:</h3>
        <textarea id="texto-extraido" class="caixa-texto" readonly></textarea>
        <button class="btn-copiar" onclick="copiarTextoCompleto()">Copiar Texto Completo</button>
    </div>
</div>

<script>
    document.getElementById('input-foto').addEventListener('change', function(e) {
        const files = e.target.files;
        if (!files || files.length === 0) return;
        const file = files[0]; 

        const status = document.getElementById('status');
        const bloco = document.getElementById('bloco-resultados');
        const previewImg = document.getElementById('preview-img');
        const caixaTexto = document.getElementById('texto-extraido');
        
        // Exibe o preview da imagem na hora
        previewImg.src = URL.createObjectURL(file);
        previewImg.style.display = "block";
        
        status.innerHTML = "⏳ Inicializando leitura... Aguarde de 5 a 10 segundos.";
        bloco.style.display = "none";

        // Cria o leitor forçando a desativação de WebWorkers locais que o Chrome bloqueia
        Tesseract.recognize(
            file,
            'eng', // Usando dicionário base para ler números e siglas (BRT, Network, KM) instantaneamente
            { logger: m => {
                if(m.status === 'recognizing text') {
                    status.innerHTML = `⏳ Lendo imagem: ${Math.floor(m.progress * 100)}%`;
                }
            }}
        ).then(({ data: { text } }) => {
            status.innerHTML = "✅ Concluído!";
            caixaTexto.value = text && text.trim() !== "" ? text : "[Nenhum texto legível encontrado]";
            bloco.style.display = "block";
        }).catch(err => {
            console.error(err);
            status.innerHTML = "❌ Ocorreu um erro ao ler a imagem localmente.";
        });
    });

    function copiarTextoCompleto() {
        const caixaTexto = document.getElementById('texto-extraido');
        caixaTexto.select();
        navigator.clipboard.writeText(caixaTexto.value).then(() => {
            alert("Texto copiado para a área de transferência!");
        });
    }
</script>

</body>
</html>
