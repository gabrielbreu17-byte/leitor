<!-- Importa a biblioteca de OCR sem mexer no design -->
<script src="https://jsdelivr.net"></script>

<script>
  // 1. Procura o botão de escolher arquivo e o texto de "Inicializando leitura..."
  const inputImagem = document.querySelector('input[type="file"]');
  
  // Vamos procurar o texto de status dinamicamente pelo que está escrito na tela
  const elementos = document.querySelectorAll('p, span, div, h3');
  let statusTexto = null;
  for (let el of elementos) {
    if (el.textContent.includes('Inicializando leitura') || el.textContent.includes('Aguarde')) {
      statusTexto = el;
      break;
    }
  }

  // 2. Executa a leitura assim que você escolhe a foto
  if (inputImagem && statusTexto) {
    inputImagem.addEventListener('change', function(e) {
      const arquivo = e.target.files[0];
      if (!arquivo) return;

      // Muda o texto mantendo a sua cor e fonte originais
      statusTexto.innerHTML = "⏳ Processando imagem... Aguarde de 5 a 10 segundos.";

      Tesseract.recognize(
        arquivo,
        'por', // Lê em português
        { logger: m => console.log(m) }
      ).then(({ data: { text } }) => {
        
        if (text.trim() === "") {
          statusTexto.innerHTML = "⚠️ Nenhum texto claro foi encontrado na imagem.";
        } else {
          statusTexto.innerHTML = "✅ **Texto Extraído:**";
          
          // Cria um parágrafo estilizado com a mesma fonte do seu site para exibir o texto
          let blocoTexto = document.getElementById('resultado-ocr');
          if (!blocoTexto) {
            blocoTexto = document.createElement('p');
            blocoTexto.id = 'resultado-ocr';
            blocoTexto.style.marginTop = '20px';
            blocoTexto.style.whiteSpace = 'pre-wrap';
            blocoTexto.style.background = '#f8f9fa'; // Um fundo sutil para destacar o texto
            blocoTexto.style.padding = '15px';
            blocoTexto.style.borderRadius = '8px';
            blocoTexto.style.border = '1px solid #e9ecef';
            blocoTexto.style.textAlign = 'left'; // Texto alinhado à esquerda para leitura
            statusTexto.parentNode.appendChild(blocoTexto);
          }
          blocoTexto.textContent = text;
        }
        
      }).catch(erro => {
        console.error(erro);
        statusTexto.innerHTML = "❌ Erro ao ler a imagem. Tente novamente.";
      });
    });
  }
</script>
